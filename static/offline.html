<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101b33">
    <title>Safe Signal is temporarily unavailable</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17233b; background: #f2f5fb; }
        body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1.5rem; }
        main { width: min(100%, 32rem); padding: 2rem; border: 1px solid #e1e7f1; border-radius: 1rem; background: #fff; box-shadow: 0 14px 40px #1b2d5412; }
        h1 { margin-top: 0; color: #101b33; }
        p { line-height: 1.6; color: #5b6880; }
        button { min-height: 2.75rem; padding: .65rem 1rem; border: 0; border-radius: .7rem; color: #fff; background: #3156c8; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <h1>Safe Signal is temporarily unavailable</h1>
        <p>The server may be restarting or your device may be offline. Your message has not been analyzed. Try again when the service is available.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
