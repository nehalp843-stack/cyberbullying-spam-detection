services:
  - type: web
    name: cyberbullying-spam-detection
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /tmp/predictions.db
